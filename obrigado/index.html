  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-dark:    #0D1440;
      --blue-primary: #1E2FBB;
      --blue-light:   #3D5AF1;
      --white:        #FFFFFF;
      --text-dark:    #0A0F2E;
      --text-muted:   #5A6490;
    }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background: linear-gradient(150deg, var(--blue-dark) 0%, #0F1A6E 55%, var(--blue-primary) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--white);
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }
    .check {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 38px; height: 38px; color: #fff; }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--text-dark);
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #16a34a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 15px 30px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn:hover { background: #128a3e; }
    .home-link {
      display: block;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: none;
    }
    .home-link:hover { color: var(--blue-primary); }
